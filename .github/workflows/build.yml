
name: Build JavaCraft Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project ZIP
        run: unzip -q JavaCraftMobile-Android-Project.zip

      - name: Build APK
        working-directory: JavaCraftMobile
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JavaCraftMobile-debug-APK
          path: JavaCraftMobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
